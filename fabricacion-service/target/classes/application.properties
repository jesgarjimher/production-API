server.port=8083
spring.application.name=fabricacion-service

# Base de datos propia para Órdenes de Fabricación
spring.datasource.url=jdbc:mysql://localhost:3306/fabricacion_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
